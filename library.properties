name=NanoTangFaust
version=0.1.0
author=Phil Schatzmann
maintainer=Phil Schatzmann <phil.schatzmann@gmail.com>
sentence=Run Faust DSP programs on a Tang Nano 20K FPGA and control them from Arduino over SPI, UART, MIDI or WiFi.
paragraph=Ships a Faust-to-FPGA compiler (tools/faust2tang) and a floating-point DSP core gateware for the Tang Nano 20K that plays audio on the board's I2S amplifier. The Arduino library (TangNanoFaust) discovers and sets the Faust program's parameters over SPI or a UART; FaustMidi plays it from MIDI received through the Serial API; FaustCompiler and FaustServerCompiler compile Faust programs on the microcontroller or over the network.
category=Signal Input/Output
url=https://github.com/pschatzmann/NanoTangFaust
architectures=*
includes=NanoTangFaust.h
